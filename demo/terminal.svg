<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 364" role="img" aria-labelledby="t d" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20">
  <title id="t">phone-body demo terminal</title>
  <desc id="d">A terminal session: the desktop body learns a fact, a real two-way sync resolves it into the phone brain, and the phone body answers a question with what the desktop was told, because both bodies read the same brain.</desc>
  <style>
    .p { fill: #7ee2a8; }
    .cmd { fill: #e8eef5; }
    .dim { fill: #9fb0c0; }
    .bad { fill: #ff9494; }
    .good { fill: #7ee2a8; }
  </style>
  <rect width="660" height="364" rx="14" fill="#0b0f14"/>
  <rect width="660" height="40" rx="14" fill="#11161d"/>
  <rect y="26" width="660" height="14" fill="#11161d"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="20" r="6" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="92" y="26" class="dim" font-size="14">taste, enforced</text>
  <text x="24" y="80"><tspan class="p">$</tspan><tspan class="cmd" dx="8">printf 'remember the launch review moved to \</tspan></text>
  <text x="24" y="112" class="cmd">    Thursday\nquit\n' | python3 skeleton/body_desktop.py \</text>
  <text x="24" y="144" class="cmd">    --brain &quot;$work/desk-brain&quot;</text>
  <text x="24" y="176" class="dim">you&gt; [desktop] Remembered, in the brain: the launch review…</text>
  <text x="24" y="208"><tspan class="p">$</tspan><tspan class="cmd" dx="8">skeleton/sync.sh &quot;$work/desk-brain&quot; &quot;$work/phone-brain&quot;</tspan></text>
  <text x="24" y="240" class="good">resolved: 2026-09-03T17:15:17Z memory/learned.md — kept des…</text>
  <text x="24" y="272"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 skeleton/body_bot.py --brain &quot;$work/phone-brain&quot; \</tspan></text>
  <text x="24" y="304" class="cmd">    --messages demo/messages.txt</text>
  <text x="24" y="336" class="dim">[phone -&gt; demo-chat] daily/2026-09-03.md: Learned through t…</text>
</svg>