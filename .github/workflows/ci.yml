name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install and run the installed commands
        run: |
          python -m pip install .
          phone-body-desktop --version
          work=$(mktemp -d)
          cp -R demo/brain "$work/desk-brain"
          printf 'remember the launch review moved to Thursday\nquit\n' | phone-body-desktop --brain "$work/desk-brain"
